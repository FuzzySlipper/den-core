# Den Core systemd service override
# Place at /etc/systemd/system/den-core.service.d/override.conf
# Then: sudo systemctl daemon-reload && sudo systemctl restart den-core.service
#
# This override ensures Den Core listens on the correct internal port and
# uses the correct production database path. The ConfigMerger handles
# DenMcp__* legacy env vars as fallback, but the DenCore__* keys are preferred.

[Service]
EnvironmentFile=/data/services/den-core/env/server.env

# Internal listen port — den-mcp facade owns :5199
Environment=DenCore__ListenUrl=http://127.0.0.1:5299

# Production database — NOT ~/.den-core/den.db
Environment=DenCore__DatabasePath=/data/services/den-core/data/den.db

# If you need to add --validate-prod, add it to ExecStart:
# ExecStart=
# ExecStart=/data/services/den-core/app/DenMcp.Server --validate-prod
